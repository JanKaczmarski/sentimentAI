name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: |
          uv run black --check src tests scripts
          uv run isort --check-only src tests scripts

      - name: Check lint and types
        run: |
          uv run ruff check src tests scripts
          uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Compile source
        run: uv run python -m compileall -q src tests scripts

      - name: Build package
        run: uv build

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet

      - name: Validate project governance
        run: |
          uv run python -m scripts.check_required_docs
          uv run python -m scripts.validate_features

      - name: Check lockfile
        run: uv lock --check

      - name: Check diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check
          fi
