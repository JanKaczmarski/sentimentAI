# Authoritative machine-readable feature registry for the thesis implementation.
# Add feature entries only after their scope and acceptance criteria are known.

schema_version: 1
project: personalized-financial-sentiment-system

lifecycle:
  maximum_in_progress: 1
  selection_status: ready
  priority_order:
    - critical
    - high
    - medium
    - low
  statuses:
    proposed:
      selectable: false
      terminal: false
      description: Candidate work that has not passed the readiness gate.
    blocked:
      selectable: false
      terminal: false
      description: Work awaiting an explicit decision, dependency, or external access.
    queued:
      selectable: false
      terminal: false
      description: Fully specified approved work waiting only for completed dependencies.
    ready:
      selectable: true
      terminal: false
      description: Fully specified work eligible for autonomous implementation.
    in_progress:
      selectable: false
      terminal: false
      description: The single feature currently being implemented.
    implemented:
      selectable: false
      terminal: false
      description: Local implementation and verification are complete; remote review remains.
    in_review:
      selectable: false
      terminal: false
      description: A pull request or required remote checks are under review.
    complete:
      selectable: false
      terminal: true
      description: Integrated into the default branch with all required evidence.
    rejected:
      selectable: false
      terminal: true
      description: Intentionally not implemented, with a recorded rationale.

feature_contract:
  required_fields:
    - id
    - title
    - status
    - priority
    - depends_on
    - scope
    - non_goals
    - acceptance_criteria
    - architecture
    - research_decisions
    - verification
  completion_evidence_required_for:
    - implemented
    - in_review
    - complete
  blocked_reason_required_for:
    - blocked
  architecture_fields:
    - layers
    - ports
  verification_fields:
    - required_test_levels
    - required_checks

selection:
  order:
    - priority
    - id
  require_completed_dependencies: true
  require_all_acceptance_criteria: true
  require_no_open_research_decisions: true

automatic_merge:
  enabled: true
  require_local_verification: true
  require_remote_ci: true
  require_clean_feature_scope: true
  require_hosting_policy_compliance: true

verification_profiles:
  code_checks: &code_checks
    - "uv run black --check src tests scripts"
    - "uv run isort --check-only src tests scripts"
    - "uv run ruff check src tests scripts"
    - "uv run mypy"
    - "uv run pytest"
    - "uv run python -m compileall -q src tests scripts"
    - "uv build"
    - "uv run pip-audit"
    - "docker compose config --quiet"
    - "uv run python -m scripts.check_required_docs"
    - "uv run python -m scripts.validate_features"
    - "uv lock --check"
    - "git diff --check"
  decision_checks: &decision_checks
    - "uv run python -m scripts.check_required_docs"
    - "uv run python -m scripts.validate_features"
    - "git diff --check"

features:
  - id: FEAT-001
    title: "Model auditable source documents and chunks"
    status: complete
    priority: critical
    depends_on: []
    scope:
      - "Add immutable domain entities for normalized source documents and document chunks."
      - "Preserve source metadata and separate raw and cleaned content."
    non_goals:
      - "Implementing cleaning, chunking, persistence, scoring, or HTTP behavior."
    acceptance_criteria:
      - id: AC-1
        description: "Documents reject missing identifiers, company, source, publication date, document type, or raw content."
      - id: AC-2
        description: "Raw and cleaned document content are represented separately and remain available to callers."
      - id: AC-3
        description: "Chunks retain their document lineage, a stable non-negative ordinal, and non-empty content."
    architecture:
      layers:
        - domain
      ports: []
    research_decisions:
      - "THESIS_DECISIONS.md#data-scope"
      - "THESIS_DECISIONS.md#runtime-and-architecture"
    verification:
      required_test_levels:
        - unit
      required_checks: *code_checks
    blocked_reason: null
    completion_evidence:
      - acceptance_criterion: AC-1
        evidence:
          - "tests/unit/domain/test_documents.py::test_source_document_rejects_missing_or_invalid_metadata"
          - "uv run pytest tests/unit/domain/test_documents.py"
      - acceptance_criterion: AC-2
        evidence:
          - "tests/unit/domain/test_documents.py::test_source_document_preserves_distinct_raw_and_cleaned_content"
          - "uv run pytest tests/unit/domain/test_documents.py"
      - acceptance_criterion: AC-3
        evidence:
          - "tests/unit/domain/test_documents.py::test_document_chunk_preserves_document_lineage_and_ordinal"
          - "tests/unit/domain/test_documents.py::test_document_chunk_rejects_invalid_lineage_or_content"
