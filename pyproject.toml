[project]
name = "sentiment-system"
version = "0.1.0"
description = "Thesis-focused personalized financial sentiment system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.50,<2",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3,<6",
    "uvicorn[standard]>=0.30,<1",
    "yfinance>=0.2,<1",
]

[dependency-groups]
dev = [
    "black>=26.3.1,<27",
    "isort>=5.13,<7",
    "mypy>=1.15,<2",
    "pip-audit>=2.7,<3",
    "pyyaml>=6.0.2,<7",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
    "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_system"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "integration: tests requiring external infrastructure such as PostgreSQL",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
files = ["src", "scripts"]
strict = true
